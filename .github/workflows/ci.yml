name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
        env:
          KATO8_DEMO: "1"
      # Fails on critical advisories in production dependencies. High advisories that have no
      # upstream fix yet are tracked in the README's security notes.
      - run: npm audit --omit=dev --audit-level=critical
